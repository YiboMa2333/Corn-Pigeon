<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4FC3F7" />
    <meta name="description" content="疯狂的鸽子 - 一只贪吃的胖鸽子围绕玉米棒啄食的魔性休闲小游戏" />
    <title>疯狂的鸽子</title>
    <link rel="preconnect" href="https://fonts.googleapis.cn" />
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin />
    <link
      href="https://fonts.googleapis.cn/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <!-- 游戏舞台：Canvas 与 UI 覆盖层共享同一片区域 -->
    <div id="game-stage">
      <canvas id="game-canvas" aria-label="疯狂的鸽子游戏画面"></canvas>

      <!-- 顶部 HUD：分数 / 时间 / Combo -->
      <div id="hud" class="hidden">
        <div class="hud-item hud-score">
          <span class="hud-label">分数</span>
          <span id="score-text" class="hud-value">0</span>
        </div>
        <div class="hud-item hud-time" id="hud-time">
          <span class="hud-label">时间</span>
          <span id="time-text" class="hud-value">60</span>
        </div>
        <div id="combo-display" class="hidden">
          <span id="combo-count">3</span>
          <span class="combo-label">COMBO</span>
        </div>
      </div>

      <!-- 飘字层（分数飘字由 JS 动态生成） -->
      <div id="float-layer"></div>

      <!-- 方向切换提示弧光（由 JS 控制可见性） -->
      <div id="direction-flash"></div>
    </div>

    <!-- Loading 页 -->
    <div id="loading-screen" class="screen">
      <div class="loading-content">
        <div class="loading-pigeon">
          <div class="loading-wing loading-wing-left"></div>
          <div class="loading-body"></div>
          <div class="loading-wing loading-wing-right"></div>
        </div>
        <div class="loading-bar">
          <div id="loading-fill" class="loading-fill"></div>
        </div>
        <p class="loading-text">正在加载玉米田…</p>
      </div>
    </div>

    <!-- 开始页 -->
    <div id="start-screen" class="screen hidden">
      <div class="screen-card">
        <h1 class="game-title">
          <span class="title-char">疯</span>
          <span class="title-char">狂</span>
          <span class="title-char">的</span>
          <span class="title-char">鸽</span>
          <span class="title-char">子</span>
        </h1>
        <p class="game-subtitle">点击屏幕，啄光金黄玉米粒！</p>
        <div class="pigeon-preview" id="pigeon-preview"></div>
        <button id="start-btn" class="game-btn primary-btn">开始游戏</button>
        <div class="tips">
          <p>🟡 好玉米 +10 分　　🟤 坏玉米 -15 分</p>
          <p>连续啄中好玉米触发 COMBO，额外加分！</p>
        </div>
      </div>
    </div>

    <!-- 结束页 -->
    <div id="end-screen" class="screen hidden">
      <div class="screen-card">
        <h2 class="end-title">游戏结束</h2>
        <div class="end-score-block">
          <span class="end-score-label">最终得分</span>
          <span id="final-score" class="end-score">0</span>
        </div>
        <div class="end-stats">
          <div class="stat-item">
            <span class="stat-label">最高连击</span>
            <span id="max-combo" class="stat-value">0</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">啄中好玉米</span>
            <span id="good-count" class="stat-value">0</span>
          </div>
        </div>
        <div class="end-buttons">
          <button id="restart-btn" class="game-btn primary-btn">再来一局</button>
          <button id="share-btn" class="game-btn secondary-btn">分享游戏</button>
        </div>
      </div>
    </div>

    <!-- 分享提示 Toast -->
    <div id="toast" class="toast hidden">已复制分享链接，快去炫耀吧！</div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
